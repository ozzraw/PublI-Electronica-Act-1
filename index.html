<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Genesys</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>
<body>
  
<!-- Proyectos desctacados IAN-->
  <section class="destacados-seccion" aria-labelledby="destacados-encabezado">
    <h1 class="destacados-encabezado" id="destacados-encabezado">Proyectos destacados</h1>
    <div class="destacados-container">
      <div class="destacados-columna">
        <section class="destacados-proyecto destacados-proyecto-horizontal">
          <div class="destacados-preview">
            <img src="IMG/London F.jpg" alt="Proyecto Fashion Week">
            <video src="previews/fashionweek.mp4" muted loop playsinline preload="none"></video>
            <h2 class="destacados-preview-titulo">Fashion Week</h2>
          </div>
        </section>
        <section class="destacados-proyecto destacados-proyecto-horizontal">
          <div class="destacados-preview">
            <img src="IMG/Ryan.jpg" alt="Proyecto Ryan">
            <video src="previews/ryan.mp4" muted loop playsinline preload="none"></video>
            <h2 class="destacados-preview-titulo">Ryan</h2>
          </div>
        </section>
      </div>
      <div class="destacados-columna">
        <section class="destacados-proyecto destacados-proyecto-horizontal">
          <div class="destacados-preview">
            <img src="IMG/VARG.jpg" alt="Proyecto VARG">
            <video src="previews/varg.mp4" muted loop playsinline preload="none"></video>
            <h2 class="destacados-preview-titulo">VARG</h2>
          </div>
        </section>
        <section class="destacados-proyecto destacados-proyecto-horizontal">
          <div class="destacados-preview">
            <img src="IMG/ROB.jpg" alt="Proyecto ROB">
            <video src="previews/rob.mp4" muted loop playsinline preload="none"></video>
            <h2 class="destacados-preview-titulo">ROB</h2>
          </div>
        </section>
      </div>
      <div class="destacados-columna">
        <section class="destacados-proyecto destacados-proyecto-vertical">
          <div class="destacados-preview">
            <img src="IMG/UFC.jpg" alt="Proyecto Boxing">
            <video src="previews/box.mp4" muted loop playsinline preload="none"></video>
            <h2 class="destacados-preview-titulo">Boxing</h2>
          </div>
        </section>
      </div>
    </div>
  </section>
  
</body>
</html>
